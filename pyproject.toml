[project]
name = "terminal-3d-sdf"
version = "1.0.0"
description = "A hardware-accelerated 3D Raymarching renderer in the console."
readme = "README.md"
authors = [
    { name = "My-ABC", email = "13020206640@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyopencl>=2026.1.5",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "terminal_3d_sdf"
data-include = ["render.cl"]

[project.scripts]
sdf-3d = "terminal_3d_sdf:main"